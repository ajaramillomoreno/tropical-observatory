name: Publish IMERG Observations

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tropical-observatory-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scientific code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install earthaccess h5py numpy matplotlib cartopy pillow

      - name: Prepare website directory
        run: |
          mkdir -p site/precipitation
          cp -R docs/. site/

      - name: Generate latest IMERG observations
        env:
          GITHUB_ACTIONS: 'true'
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/generate_tropical_precipitation.py --output-dir site/precipitation

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website for deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
